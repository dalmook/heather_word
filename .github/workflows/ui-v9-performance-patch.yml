name: Optimize commercial UI runtime

on:
  push:
    branches: ["codex/commercial-ui-v9"]
    paths:
      - ".github/workflows/ui-v9-performance-patch.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-ui-v9
          fetch-depth: 0
      - name: Lazy-load optional Firebase and Phaser runtimes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          old_imports = '''import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
          import {
            getAuth,
            signInAnonymously,
            onAuthStateChanged
          } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
          import {
            getFirestore,
            collection,
            doc,
            setDoc,
            deleteDoc,
            onSnapshot,
            serverTimestamp,
            query,
            orderBy,
            limit,
            getDocs,
            writeBatch
          } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
          '''
          new_imports = '''let initializeApp;
          let getAuth;
          let signInAnonymously;
          let onAuthStateChanged;
          let getFirestore;
          let collection;
          let doc;
          let setDoc;
          let deleteDoc;
          let onSnapshot;
          let serverTimestamp;
          let query;
          let orderBy;
          let limit;
          let getDocs;
          let writeBatch;
          let firebaseRuntimePromise = null;

          async function loadFirebaseRuntime() {
            if (firebaseRuntimePromise) return firebaseRuntimePromise;
            firebaseRuntimePromise = Promise.all([
              import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
              import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
              import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")
            ]).then(([appModule, authModule, firestoreModule]) => {
              ({ initializeApp } = appModule);
              ({ getAuth, signInAnonymously, onAuthStateChanged } = authModule);
              ({
                getFirestore,
                collection,
                doc,
                setDoc,
                deleteDoc,
                onSnapshot,
                serverTimestamp,
                query,
                orderBy,
                limit,
                getDocs,
                writeBatch
              } = firestoreModule);
            });
            return firebaseRuntimePromise;
          }
          '''
          if old_imports not in app:
              raise SystemExit('app Firebase imports not found')
          app = app.replace(old_imports, new_imports, 1)
          init_anchor = '''  try {
              firebase.app = initializeApp(window.HEATHER_FIREBASE_CONFIG);'''
          init_replacement = '''  try {
              await loadFirebaseRuntime();
              firebase.app = initializeApp(window.HEATHER_FIREBASE_CONFIG);'''
          if init_anchor not in app:
              raise SystemExit('app Firebase init anchor not found')
          app = app.replace(init_anchor, init_replacement, 1)

          avatar_anchor = '''let avatarGameController = null;
          let avatarGameFailed = false;
          '''
          avatar_loader = '''let avatarGameController = null;
          let avatarGameFailed = false;
          let avatarRuntimePromise = null;

          function loadOptionalScript(src, marker) {
            return new Promise((resolve, reject) => {
              const existing = document.querySelector(`script[data-${marker}]`);
              if (existing?.dataset.loaded === "true") return resolve();
              if (existing) {
                existing.addEventListener("load", resolve, { once: true });
                existing.addEventListener("error", reject, { once: true });
                return;
              }
              const script = document.createElement("script");
              script.src = src;
              script.defer = true;
              script.setAttribute(`data-${marker}`, "true");
              script.addEventListener("load", () => {
                script.dataset.loaded = "true";
                resolve();
              }, { once: true });
              script.addEventListener("error", reject, { once: true });
              document.head.appendChild(script);
            });
          }

          function ensureAvatarRuntime() {
            if (window.Phaser && window.HeatherAvatarPhaser?.mount) return Promise.resolve();
            if (avatarRuntimePromise) return avatarRuntimePromise;
            avatarRuntimePromise = loadOptionalScript(
              "https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js",
              "heather-phaser-runtime"
            ).then(() => loadOptionalScript("./avatar-phaser.js?v=9.0.0", "heather-avatar-runtime"))
              .then(() => {
                if (!window.Phaser || !window.HeatherAvatarPhaser?.mount) {
                  throw new Error("Avatar renderer unavailable");
                }
              });
            return avatarRuntimePromise;
          }
          '''
          if avatar_anchor not in app:
              raise SystemExit('avatar state anchor not found')
          app = app.replace(avatar_anchor, avatar_loader, 1)

          old_missing = '''  if (!window.Phaser || !window.HeatherAvatarPhaser?.mount) {
              showAvatarGameStatus("드레스룸을 불러오지 못했어요. 기본 미리보기로 계속 사용할 수 있어요.", true);
              return;
            }
          '''
          new_missing = '''  if (!window.Phaser || !window.HeatherAvatarPhaser?.mount) {
              showAvatarGameStatus("드레스룸을 준비하고 있어요…", true);
              if (!avatarRuntimePromise) {
                ensureAvatarRuntime()
                  .then(() => {
                    avatarGameFailed = false;
                    renderPhaserAvatar(options);
                  })
                  .catch((error) => {
                    console.info("Phaser 드레스룸은 DOM 미리보기로 대체합니다.", error);
                    avatarGameFailed = true;
                    dom.avatarGame?.classList.add("failed");
                    showAvatarGameStatus("고급 미리보기를 불러오지 못했어요. 기본 미리보기로 계속 사용할 수 있어요.", true);
                  });
              }
              return;
            }
          '''
          if old_missing not in app:
              raise SystemExit('avatar fallback block not found')
          app = app.replace(old_missing, new_missing, 1)
          app_path.write_text(app, encoding='utf-8')

          season_path = Path('season2.js')
          season = season_path.read_text(encoding='utf-8')
          old_season_imports = '''import { getApps, initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
          import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
          import {
            getFirestore,
            collection,
            doc,
            getDoc,
            getDocs,
            updateDoc,
            serverTimestamp
          } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
          '''
          new_season_imports = '''let getApps;
          let initializeApp;
          let getAuth;
          let signInAnonymously;
          let onAuthStateChanged;
          let getFirestore;
          let collection;
          let doc;
          let getDoc;
          let getDocs;
          let updateDoc;
          let serverTimestamp;
          let season2FirebaseRuntimePromise = null;

          async function loadSeason2FirebaseRuntime() {
            if (season2FirebaseRuntimePromise) return season2FirebaseRuntimePromise;
            season2FirebaseRuntimePromise = Promise.all([
              import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
              import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
              import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")
            ]).then(([appModule, authModule, firestoreModule]) => {
              ({ getApps, initializeApp } = appModule);
              ({ getAuth, signInAnonymously, onAuthStateChanged } = authModule);
              ({ getFirestore, collection, doc, getDoc, getDocs, updateDoc, serverTimestamp } = firestoreModule);
            });
            return season2FirebaseRuntimePromise;
          }
          '''
          if old_season_imports not in season:
              raise SystemExit('Season 2 Firebase imports not found')
          season = season.replace(old_season_imports, new_season_imports, 1)
          season = season.replace('const MANAGE_PASSWORD = "3341";\n', '', 1)
          setup_anchor = '''  try {
              app.firebase.app = getApps()[0] || initializeApp(window.HEATHER_FIREBASE_CONFIG, "heather-season2");'''
          setup_replacement = '''  try {
              await loadSeason2FirebaseRuntime();
              app.firebase.app = getApps()[0] || initializeApp(window.HEATHER_FIREBASE_CONFIG, "heather-season2");'''
          if setup_anchor not in season:
              raise SystemExit('Season 2 Firebase setup anchor not found')
          season = season.replace(setup_anchor, setup_replacement, 1)

          old_report = '''function openReport() {
              const value = window.prompt("관리 비밀번호 4자리를 입력하세요.");
              if (value === null) return;
              if (value !== MANAGE_PASSWORD) {
                showToast("비밀번호 확인", "관리 비밀번호가 맞지 않아요.");
                return;
              }
              app.lastReport = buildLearningReport(app.season2, app.words, app.categories, new Date());
              openSeason2("report");
            }
          '''
          new_report = '''function openReport() {
              if (window.HEATHER_PARENT_GATE_GRANTED !== true) {
                window.dispatchEvent(new CustomEvent("heather:parent-gate-request"));
                showToast("보호자 확인", "보호자 PIN 확인 후 리포트를 다시 열어 주세요.");
                return;
              }
              app.lastReport = buildLearningReport(app.season2, app.words, app.categories, new Date());
              openSeason2("report");
            }
          '''
          if old_report not in season:
              raise SystemExit('Season 2 report password block not found')
          season = season.replace(old_report, new_report, 1)
          season_path.write_text(season, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" defer></script>\n', '')
          html = html.replace('  <script src="./avatar-phaser.js?v=7.4" defer></script>\n', '')
          index_path.write_text(html, encoding='utf-8')
          PY
          node --check app.js
          node --check season2.js
          ! grep -q '^import .*firebase' app.js
          ! grep -q 'MANAGE_PASSWORD' season2.js
          ! grep -q 'phaser.min.js' index.html
          grep -q 'loadFirebaseRuntime' app.js
          grep -q 'loadSeason2FirebaseRuntime' season2.js
          grep -q 'ensureAvatarRuntime' app.js
      - name: Commit runtime optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js season2.js index.html
          git commit -m "perf: lazy-load Firebase and Phaser only when needed"
          git push origin HEAD:codex/commercial-ui-v9
