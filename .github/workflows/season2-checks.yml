name: Season 2 checks

on:
  push:
    branches: [main, "release/season2-live"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, migration, learning and asset tests
        run: npm run check
