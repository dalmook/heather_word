name: Apply 8.1 cache bust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-bust-8-1.yml"

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Version the production loader URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="./firebase-config.js"></script>'
          new = '<script src="./firebase-config.js?v=8.1.0"></script>'
          if new not in text:
              if old not in text:
                  raise SystemExit('firebase-config script tag not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index already versioned"
            exit 0
          fi
          git commit -m "fix: bust the 8.1 production loader cache"
          git push origin HEAD:main
