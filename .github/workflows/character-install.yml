name: Apply verified character renewal
on:
  push:
    branches: ['character-ip/renewal-20260906']
    paths: ['.github/workflows/character-install.yml']
permissions:
  contents: write
concurrency:
  group: character-renewal-install
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/character-ip/renewal-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve verified implementation from repository blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/character-evidence
          : > /tmp/character-renewal.xz
          for sha in be51fbe0753df89311f0929f50761ebd3f755209 54a3b7bf23a1a59a7d9e8efa1a9f2f541959ed39 cb7edb1421ce9ab6d91ba6cf0d4fa79cc95d3403 4326ad997d23d9896c0c904ee8f88ebc2ae72666 b864020963e1614763f41cd3f6b004247248ba9c 38a8b2db14df6793c60bee80e3aa219d40d05fe7 a70709f38c943a990c23e75574e4953473f6aeea a067c7093b79a58899dfd7c1754cf03f79003cca 289b7f6d8e176ae6d9f70231d155469472443082 660e37e2bd27237d9c9590688bb88ca6ed46ac45 b53fe64acb2097e6db5beb47a60690e8180083db; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$sha" --jq .content | base64 --decode >> /tmp/character-renewal.xz
          done
          echo 'ede5f2adb2bd0da0587203301ad80eff2635f2d5070291df93414bef0e88751d  /tmp/character-renewal.xz' | sha256sum --check
      - name: Validate exact base files and apply reviewed UTF-8 changes
        run: |
          python3 - <<'PY'
          import hashlib,json,lzma,pathlib
          root=pathlib.Path.cwd().resolve()
          rows=json.loads(lzma.decompress(pathlib.Path('/tmp/character-renewal.xz').read_bytes()))
          assert len(rows)==33
          prepared=[]
          for row in rows:
              relative=pathlib.PurePosixPath(row['path'])
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              path=root.joinpath(*relative.parts)
              assert root in path.resolve().parents
              if row['before'] is None:
                  assert not path.exists(),f'New-file collision: {relative}'
                  updated=row['content']
              else:
                  old=path.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==row['before'],f'Changed base: {relative}'
                  lines=old.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(row['edits']):
                      assert 0<=edit['start']<=edit['end']<=len(lines)
                      lines[edit['start']:edit['end']]=edit['lines']
                  updated=''.join(lines)
              data=updated.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==row['after'],f'Output mismatch: {relative}'
              prepared.append((path,data))
          for path,data in prepared:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          print('Applied 33 verified source, test and documentation changes.')
          PY
      - name: Generate optimized deployment assets and enforce contracts
        run: |
          set -o pipefail
          npm run generate:assets
          npm run check 2>&1 | tee /tmp/character-evidence/check.log
          find assets -name '*.svg' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/character-assets.sha256
          npm run generate:assets
          sha256sum --check /tmp/character-assets.sha256 > /tmp/character-evidence/reproducibility.log
      - name: Commit implementation to work branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/character-ip/renewal-20260906
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js assets avatar-phaser.js character-*.js character-ui.css docs/characters firebase-config.js index.html monster-catalog-season2.js package.json season2.js tests tools ui-v9.css ui-v9.js ui/components.js
          git commit -m 'feat: original character art, unified avatar wardrobe and compatible collection renewal'
          git push origin HEAD:character-ip/renewal-20260906
          git rev-parse HEAD | tee /tmp/character-evidence/implementation-commit.txt
      - name: Install Korean browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Prepare identical baseline and updated preview servers
        run: |
          mkdir -p /tmp/character-baseline
          git archive 9d295e2d8375ebbf246c25d2964999f6497f3b90 | tar -x -C /tmp/character-baseline
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/character-after-http.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/character-baseline >/tmp/character-before-http.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Baseline browser evidence
        env:
          BASE_URL: http://127.0.0.1:4174
          CHARACTER_BASELINE: '1'
          CHARACTER_QA_OUTPUT: /tmp/character-evidence/before
        run: node tools/character-integration-qa.mjs
      - name: Updated browser integration evidence
        if: success() || failure()
        env:
          BASE_URL: http://127.0.0.1:4173
          CHARACTER_QA_OUTPUT: /tmp/character-evidence/after
        run: node tools/character-integration-qa.mjs
      - name: Preserve test logs, screenshots and exact implementation snapshot
        if: always()
        run: |
          git archive --format=tar.gz HEAD > /tmp/character-evidence/implementation-source.tar.gz
          cp /tmp/character-after-http.log /tmp/character-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-integration-${{ github.run_id }}
          path: /tmp/character-evidence/
          retention-days: 14
