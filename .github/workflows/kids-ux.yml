name: Kids UX release checks
on:
  push:
    branches: ["redesign/kids-ux-20260905"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kids-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Korean screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Preserve exact source and run data compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kids-review/audit
          git archive --format=zip HEAD -o /tmp/kids-review/source.zip
          git rev-parse HEAD > /tmp/kids-review/commit.txt
          npm run check 2>&1 | tee /tmp/kids-review/audit/check.txt
      - name: Start Pages subpath preview
        run: |
          mkdir -p /tmp/kids-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/kids-preview/heather_word
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/kids-preview >/tmp/kids-http.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/heather_word/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/kids-http.log
          exit 1
      - name: All learning regressions and child-specific interactions
        env:
          BASE_URL: http://127.0.0.1:4173/heather_word
          UI_QA_OUTPUT: /tmp/kids-review/audit
        run: node tools/ui-v9-browser-qa.mjs
      - name: Actual pointer, settled layouts and console checks
        if: always()
        env:
          BASE_URL: http://127.0.0.1:4173/heather_word
          UI_QA_OUTPUT: /tmp/kids-review/audit
        run: node tools/commercial-visual-qa.mjs
      - name: Lighthouse evidence
        if: always()
        run: |
          npx --yes lighthouse@12.2.1 "http://127.0.0.1:4173/heather_word/?mode=local&lighthouse=1#/home" --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/kids-review/audit/lighthouse.json --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heather-kids-ux-review
          path: /tmp/kids-review
          retention-days: 14
          if-no-files-found: error
