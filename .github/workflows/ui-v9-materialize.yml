name: Materialize commercial UI v9

on:
  push:
    branches: ["codex/commercial-ui-v9"]
    paths:
      - ".github/workflows/ui-v9-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-ui-v9
          fetch-depth: 0
      - name: Expand checksum-verified source files
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.ui-v9-js.part{00..03} | base64 --decode | gzip -dc > ui-v9.js
          cat tools/.ui-v9-css.part{00..01} | base64 --decode | gzip -dc > ui-v9.css
          echo "5620d92d5bbb82683612b7c0a515bf5675386f9ad47375c24d59a5cb81be9d60  ui-v9.js" | sha256sum -c -
          echo "9475056040925349a0597e4280cf3f92dfede350c0369227b5e427076a84f605  ui-v9.css" | sha256sum -c -
          node --check ui-v9.js
          rm -f tools/.ui-v9-js.part* tools/.ui-v9-css.part*
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v9.js ui-v9.css tools
          git commit -m "feat: add the commercial five-tab app shell"
          git push origin HEAD:codex/commercial-ui-v9
