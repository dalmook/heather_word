name: Apply final commercial UI polish

on:
  push:
    branches: ["codex/commercial-ui-v9"]
    paths:
      - ".github/workflows/ui-v9-final-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-ui-v9
          fetch-depth: 0
      - name: Fix desktop width, favicon and network diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('ui-v9.css')
          css = css_path.read_text(encoding='utf-8')
          if not re.search(r'@media \(min-width: 900px\)[\s\S]*?\.hw9-app \{[\s\S]*?max-width: var\(--app-max-desktop\);', css):
              pattern = re.compile(r'(@media \(min-width: 900px\) \{[\s\S]*?\n\s*\.hw9-app \{\n\s*grid-template-columns: 96px minmax\(0, 1fr\);\n)')
              css, count = pattern.subn(r'\1    max-width: var(--app-max-desktop);\n', css, count=1)
              if count != 1:
                  raise SystemExit('desktop app anchor not found')
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          favicon = '  <link rel="icon" href="./assets/icons/app-icon.svg?v=9.0.0" type="image/svg+xml" />\n'
          if favicon not in html:
              anchor = '  <title>Heather Word · Spellingmon</title>\n'
              if anchor not in html:
                  raise SystemExit('title anchor not found')
              html = html.replace(anchor, anchor + favicon, 1)
          index_path.write_text(html, encoding='utf-8')

          qa_path = Path('tools/ui-v9-browser-qa.mjs')
          qa = qa_path.read_text(encoding='utf-8')
          if 'const networkErrors = [];' not in qa:
              qa = qa.replace('const consoleErrors = [];\n', 'const consoleErrors = [];\nconst networkErrors = [];\n', 1)
          if 'Network.responseReceived' not in qa:
              pattern = re.compile(r'(\s*cdp\.on\("Runtime\.consoleAPICalled", \(\{ type, args \}\) => \{[\s\S]*?\n\s*\}\);\n)')
              addition = '''    cdp.on("Network.responseReceived", ({ response }) => {
                if (Number(response?.status) >= 400) networkErrors.push(`${response.status} ${response.url}`);
              });
          '''
              qa, count = pattern.subn(lambda match: match.group(1) + addition, qa, count=1)
              if count != 1:
                  raise SystemExit('console listener anchor not found')
          if not re.search(r'consoleErrors,\s*\n\s*networkErrors,\s*\n\s*exceptions: errors', qa):
              qa, count = re.subn(r'(\s+consoleErrors,\n)(\s+exceptions: errors,)', r'\1      networkErrors,\n\2', qa, count=1)
              if count != 1:
                  raise SystemExit('report anchor not found')
          if 'networkErrors.length' not in qa:
              qa, count = re.subn(
                  r'if \(errors\.length \|\| consoleErrors\.length\) \{\n\s*throw new Error\(`Browser errors: \$\{JSON\.stringify\(\{ errors, consoleErrors \}\)\}`\);\n\s*\}',
                  'if (errors.length || consoleErrors.length || networkErrors.length) {\n      throw new Error(`Browser errors: ${JSON.stringify({ errors, consoleErrors, networkErrors })}`);\n    }',
                  qa,
                  count=1
              )
              if count != 1:
                  raise SystemExit('browser error condition not found')
          qa_path.write_text(qa, encoding='utf-8')
          PY
          node --check tools/ui-v9-browser-qa.mjs
          grep -q 'max-width: var(--app-max-desktop)' ui-v9.css
          grep -q 'assets/icons/app-icon.svg?v=9.0.0' index.html
          grep -q 'Network.responseReceived' tools/ui-v9-browser-qa.mjs
      - name: Commit final visual polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v9.css index.html tools/ui-v9-browser-qa.mjs
          git commit -m "fix: widen desktop app shell and eliminate missing favicon requests"
          git push origin HEAD:codex/commercial-ui-v9

# trigger: regex-safe-final-polish
