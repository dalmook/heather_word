name: Live Pages smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed static assets
        shell: bash
        env:
          BASE_URL: https://dalmook.github.io/heather_word
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..36}; do
            if curl -fsSL --retry 2 "${BASE_URL}/season2.js?deploy=${RELEASE_SHA}" -o /tmp/season2.js \
              && curl -fsSL --retry 2 "${BASE_URL}/season2-polish.js?deploy=${RELEASE_SHA}" -o /tmp/season2-polish.js \
              && curl -fsSL --retry 2 "${BASE_URL}/season2-polish.css?deploy=${RELEASE_SHA}" -o /tmp/season2-polish.css \
              && curl -fsSL --retry 2 "${BASE_URL}/firebase-config.js?deploy=${RELEASE_SHA}" -o /tmp/firebase-config.js \
              && curl -fsSL --retry 2 "${BASE_URL}/assets/monsters/season2/cookie/crumb_bear_1.svg?deploy=${RELEASE_SHA}" -o /tmp/crumb-bear.svg \
              && grep -q '스펠링 월드 시즌 2' /tmp/season2.js \
              && grep -q 'POLISH_VERSION = "8.1.0"' /tmp/season2-polish.js \
              && grep -q '#homeScreen.s2-market-home.active' /tmp/season2-polish.css \
              && grep -q 'season2-polish.js' /tmp/firebase-config.js \
              && grep -q '<svg' /tmp/crumb-bear.svg; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          printf 'live assets: season2=%s, polish-js=%s, polish-css=%s, svg=%s bytes\n' \
            "$(wc -c < /tmp/season2.js)" \
            "$(wc -c < /tmp/season2-polish.js)" \
            "$(wc -c < /tmp/season2-polish.css)" \
            "$(wc -c < /tmp/crumb-bear.svg)"

      - name: Verify collision-free mobile home after JavaScript boot
        shell: bash
        env:
          BASE_URL: https://dalmook.github.io/heather_word
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          ok=0
          for attempt in {1..18}; do
            "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --window-size=390,844 \
              --virtual-time-budget=15000 \
              --dump-dom \
              "${BASE_URL}/?mode=local&deploy=${RELEASE_SHA}" > /tmp/heather-live-dom.html 2>/tmp/heather-live-browser.log || true
            if grep -q 'data-home-polish-version="8.1.0"' /tmp/heather-live-dom.html \
              && grep -q 'id="s2HomeUtility"' /tmp/heather-live-dom.html \
              && grep -q 'data-s2-relocated="hero"' /tmp/heather-live-dom.html \
              && grep -q 'data-s2-relocated="mission"' /tmp/heather-live-dom.html \
              && grep -q 'data-s2-legacy-hero="hidden"' /tmp/heather-live-dom.html \
              && grep -q '오늘의 모험 시작' /tmp/heather-live-dom.html; then
              ok=1
              break
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/heather-live-browser.log || true
            grep -n 'home-polish\|s2HomeUtility\|season2HomePanel\|bootstrap failed' /tmp/heather-live-dom.html | head -80 || true
            exit 1
          fi

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=15000 \
            --screenshot=/tmp/heather-live-home.png \
            "${BASE_URL}/?mode=local&deploy=${RELEASE_SHA}" >/tmp/heather-live-shot.log 2>&1

          test -s /tmp/heather-live-home.png
          grep -o '오늘의 모험 시작\|내 단어장\|자유 학습' /tmp/heather-live-dom.html | sort -u

      - name: Upload mobile visual proof
        uses: actions/upload-artifact@v4
        with:
          name: heather-word-mobile-home-${{ github.sha }}
          path: /tmp/heather-live-home.png
          if-no-files-found: error
          retention-days: 7
