name: Live Pages smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-pages-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Korean screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify exact release files on Pages
        shell: bash
        env:
          BASE_URL: https://dalmook.github.io/heather_word
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-proof /tmp/live-assets
          printf '%s\n' "$RELEASE_SHA" > /tmp/live-proof/release-sha.txt
          assets=(index.html app.js ui-v9.js ui-v9-core.js ui-v9.css firebase-config.js season2.js ui/components.js ui/tokens.css ui/components.css ui/layout.css ui/legacy.css manifest.webmanifest 404.html assets/icons/app-icon.svg assets/icons/app-192.png assets/icons/app-512.png assets/icons/apple-touch-icon.png assets/icons/social-card.png)
          ok=0
          for attempt in {1..60}; do
            matched=1
            : > /tmp/live-proof/asset-checks.txt
            for asset in "${assets[@]}"; do
              mkdir -p "/tmp/live-assets/$(dirname "$asset")"
              if ! curl -fsSL --connect-timeout 10 --max-time 20 --retry 1 \
                  "${BASE_URL}/${asset}?deploy=${RELEASE_SHA}" -o "/tmp/live-assets/${asset}" \
                  || ! cmp -s "$asset" "/tmp/live-assets/${asset}"; then
                printf 'not yet matching: %s\n' "$asset" >> /tmp/live-proof/asset-checks.txt
                matched=0
                break
              fi
              sha256sum "/tmp/live-assets/${asset}" >> /tmp/live-proof/asset-checks.txt
            done
            if [ "$matched" -eq 1 ]; then ok=1; break; fi
            sleep 5
          done
          cat /tmp/live-proof/asset-checks.txt
          test "$ok" -eq 1
      - name: Verify live mobile and desktop app navigation
        env:
          BASE_URL: https://dalmook.github.io/heather_word
          UI_QA_OUTPUT: /tmp/live-proof
        run: node tools/commercial-visual-qa.mjs
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heather-word-live-${{ github.sha }}
          path: /tmp/live-proof
          if-no-files-found: error
          retention-days: 14
