name: Live Pages smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for commercial v9 assets on Pages
        shell: bash
        env:
          BASE_URL: https://dalmook.github.io/heather_word
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..60}; do
            if curl -fsSL --retry 2 "${BASE_URL}/ui-v9.js?deploy=${RELEASE_SHA}" -o /tmp/ui-v9.js \
              && curl -fsSL --retry 2 "${BASE_URL}/ui-v9.css?deploy=${RELEASE_SHA}" -o /tmp/ui-v9.css \
              && curl -fsSL --retry 2 "${BASE_URL}/firebase-config.js?deploy=${RELEASE_SHA}" -o /tmp/firebase-config.js \
              && curl -fsSL --retry 2 "${BASE_URL}/assets/icons/app-icon.svg?deploy=${RELEASE_SHA}" -o /tmp/app-icon.svg \
              && grep -q 'UI_V9_VERSION' /tmp/ui-v9.js \
              && grep -q 'Heather Word UI v9' /tmp/ui-v9.css \
              && grep -q 'RELEASE = "9.0.0"' /tmp/firebase-config.js \
              && grep -q '<svg' /tmp/app-icon.svg; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          printf 'live assets: ui=%s css=%s loader=%s icon=%s bytes\n' \
            "$(wc -c < /tmp/ui-v9.js)" \
            "$(wc -c < /tmp/ui-v9.css)" \
            "$(wc -c < /tmp/firebase-config.js)" \
            "$(wc -c < /tmp/app-icon.svg)"

      - name: Verify live mobile and desktop app shell
        shell: bash
        env:
          BASE_URL: https://dalmook.github.io/heather_word
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p /tmp/live-proof
          for size in 360x800 390x844 430x932 1440x1000; do
            width="${size%x*}"
            height="${size#*x}"
            ready=0
            for attempt in {1..18}; do
              "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --hide-scrollbars --window-size="${width},${height}" --virtual-time-budget=16000 \
                --dump-dom "${BASE_URL}/?mode=local&deploy=${RELEASE_SHA}#/home" \
                > "/tmp/live-proof/home-${size}.html" 2> "/tmp/live-proof/browser-${size}.log" || true
              if grep -q 'data-hw9-version="9.0.0"' "/tmp/live-proof/home-${size}.html" \
                && grep -q 'data-hw9-tab="home"' "/tmp/live-proof/home-${size}.html" \
                && grep -q 'data-hw9-tab="learn"' "/tmp/live-proof/home-${size}.html" \
                && grep -q 'data-hw9-tab="games"' "/tmp/live-proof/home-${size}.html" \
                && grep -q 'data-hw9-tab="collection"' "/tmp/live-proof/home-${size}.html" \
                && grep -q 'data-hw9-tab="my"' "/tmp/live-proof/home-${size}.html"; then
                ready=1
                break
              fi
              sleep 4
            done
            test "$ready" -eq 1
            "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size="${width},${height}" --virtual-time-budget=16000 \
              --screenshot="/tmp/live-proof/home-${size}.png" \
              "${BASE_URL}/?mode=local&deploy=${RELEASE_SHA}#/home" >/dev/null 2>&1
            test -s "/tmp/live-proof/home-${size}.png"
          done
          grep -o '오늘 학습 시작하기\|이어서 학습하기\|오늘 기록 보기' /tmp/live-proof/home-390x844.html | head -1

      - name: Upload live visual proof
        uses: actions/upload-artifact@v4
        with:
          name: heather-word-live-v9-${{ github.sha }}
          path: /tmp/live-proof
          if-no-files-found: error
          retention-days: 14
