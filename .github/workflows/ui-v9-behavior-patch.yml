name: Patch commercial navigation behavior

on:
  push:
    branches: ["codex/commercial-ui-v9"]
    paths:
      - ".github/workflows/ui-v9-behavior-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-ui-v9
          fetch-depth: 0
      - name: Patch role detection and focused-screen navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          ui_path = Path('ui-v9.js')
          ui = ui_path.read_text(encoding='utf-8')

          if 'window.HEATHER_FIREBASE_ADMIN = app.claims.admin;' not in ui:
              pattern = re.compile(
                  r'    const auth = getAuth\(instance\);\n'
                  r'    if \(!auth\.currentUser\) return;\n'
                  r'    const token = await getIdTokenResult\(auth\.currentUser, false\);\n'
                  r'    app\.claims\.admin = token\.claims\.admin === true;\n'
                  r'    app\.claims\.guardian = token\.claims\.guardian === true \|\| app\.claims\.admin;\n'
                  r'    document\.body\.classList\.toggle\("hw9-admin-claim", app\.claims\.admin\);'
              )
              replacement = '''    const auth = getAuth(instance);
              for (let attempt = 0; attempt < 40 && !auth.currentUser; attempt += 1) {
                await new Promise((resolve) => setTimeout(resolve, 100));
              }
              if (!auth.currentUser) return;
              const token = await getIdTokenResult(auth.currentUser, false);
              app.claims.admin = token.claims.admin === true;
              app.claims.guardian = token.claims.guardian === true || app.claims.admin;
              window.HEATHER_FIREBASE_ADMIN = app.claims.admin;
              window.HEATHER_FIREBASE_GUARDIAN = app.claims.guardian;
              document.body.classList.toggle("hw9-admin-claim", app.claims.admin);'''
              ui, count = pattern.subn(replacement, ui, count=1)
              if count != 1:
                  raise SystemExit('role claim block not found')

          if 'function interceptLegacyBack(event)' not in ui:
              marker = '\n\nfunction enhanceSeason2Overlay() {'
              if marker not in ui:
                  raise SystemExit('season2 overlay marker not found')
              back = '''

              function interceptLegacyBack(event) {
                const back = event.target.closest?.(".back-btn, #gameBackBtn");
                if (!back || !document.body.classList.contains("hw9-legacy-active")) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                goHomeFromLegacy();
              }'''
              ui = ui.replace(marker, back + marker, 1)

          if 'document.addEventListener("click", interceptLegacyBack, true);' not in ui:
              anchor = '  document.addEventListener("click", interceptLegacyManage, true);\n'
              if anchor not in ui:
                  raise SystemExit('legacy manage listener not found')
              ui = ui.replace(anchor, anchor + '  document.addEventListener("click", interceptLegacyBack, true);\n', 1)

          if 'backToShell: () => goHomeFromLegacy(),' not in ui:
              anchor = '    openAdventure,\n'
              if anchor not in ui:
                  raise SystemExit('global API anchor not found')
              ui = ui.replace(anchor, anchor + '    backToShell: () => goHomeFromLegacy(),\n', 1)

          ui_path.write_text(ui, encoding='utf-8')

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          if 'screen === "manage" && window.HEATHER_FIREBASE_ADMIN === true' not in app:
              pattern = re.compile(
                  r'  if \(screen === "rank"\) loadRanking\(\);\n'
                  r'  if \(screen === "manage"\) loadRewardAdminClaims\(\);\n'
                  r'  if \(screen === "game"\) startRound\("choice"\);'
              )
              replacement = '''  if (screen === "rank") loadRanking();
              if (screen === "manage" && window.HEATHER_FIREBASE_ADMIN === true) {
                loadRewardAdminClaims();
              } else if (screen === "manage") {
                state.rewardAdminClaims = [];
                state.rewardAdminPlayers = [];
                state.rewardAdminLoaded = true;
              }
              if (screen === "game") startRound("choice");'''
              app, count = pattern.subn(replacement, app, count=1)
              if count != 1:
                  raise SystemExit('admin loading block not found')
          app_path.write_text(app, encoding='utf-8')
          PY
          node --check ui-v9.js
          node --check app.js
          grep -q 'interceptLegacyBack' ui-v9.js
          grep -q 'backToShell' ui-v9.js
          grep -q 'HEATHER_FIREBASE_ADMIN' app.js
      - name: Commit navigation and role behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v9.js app.js
          git commit -m "fix: make focused screens navigate back and require admin claims"
          git push origin HEAD:codex/commercial-ui-v9

# trigger: robust-finalize-v9-2
