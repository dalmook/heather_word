name: Patch commercial navigation behavior

on:
  push:
    branches: ["codex/commercial-ui-v9"]
    paths:
      - ".github/workflows/ui-v9-behavior-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-ui-v9
          fetch-depth: 0
      - name: Patch role detection and focus-screen back navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ui = Path('ui-v9.js')
          text = ui.read_text(encoding='utf-8')
          old_claims = '''    const auth = getAuth(instance);
              if (!auth.currentUser) return;
              const token = await getIdTokenResult(auth.currentUser, false);
              app.claims.admin = token.claims.admin === true;
              app.claims.guardian = token.claims.guardian === true || app.claims.admin;
              document.body.classList.toggle("hw9-admin-claim", app.claims.admin);
          '''
          new_claims = '''    const auth = getAuth(instance);
              for (let attempt = 0; attempt < 40 && !auth.currentUser; attempt += 1) {
                await new Promise((resolve) => setTimeout(resolve, 100));
              }
              if (!auth.currentUser) return;
              const token = await getIdTokenResult(auth.currentUser, false);
              app.claims.admin = token.claims.admin === true;
              app.claims.guardian = token.claims.guardian === true || app.claims.admin;
              window.HEATHER_FIREBASE_ADMIN = app.claims.admin;
              window.HEATHER_FIREBASE_GUARDIAN = app.claims.guardian;
              document.body.classList.toggle("hw9-admin-claim", app.claims.admin);
          '''
          if old_claims not in text:
              raise SystemExit('claim block not found')
          text = text.replace(old_claims, new_claims, 1)

          manage_fn = '''function interceptLegacyManage(event) {
              const manage = event.target.closest?.('[data-nav="manage"]');
              if (!manage || window.HEATHER_PARENT_GATE_GRANTED === true) return;
              event.preventDefault();
              event.stopImmediatePropagation();
              openParentGate();
            }
          '''
          back_fn = manage_fn + '''
            function interceptLegacyBack(event) {
              const back = event.target.closest?.(".back-btn, #gameBackBtn");
              if (!back || !document.body.classList.contains("hw9-legacy-active")) return;
              event.preventDefault();
              event.stopImmediatePropagation();
              goHomeFromLegacy();
            }
          '''
          if manage_fn not in text:
              raise SystemExit('manage interceptor not found')
          text = text.replace(manage_fn, back_fn, 1)

          old_bind = '''  document.addEventListener("click", interceptLegacyManage, true);
              document.addEventListener("click", () => setTimeout(enhanceSeason2Overlay, 0), true);
          '''
          new_bind = '''  document.addEventListener("click", interceptLegacyManage, true);
              document.addEventListener("click", interceptLegacyBack, true);
              document.addEventListener("click", () => setTimeout(enhanceSeason2Overlay, 0), true);
          '''
          if old_bind not in text:
              raise SystemExit('bind anchor not found')
          text = text.replace(old_bind, new_bind, 1)

          old_api = '''    openLegacy,
                openAdventure,
                getSnapshot: () => typeof structuredClone === "function" ? structuredClone(app.snapshot) : JSON.parse(JSON.stringify(app.snapshot))
          '''
          new_api = '''    openLegacy,
                openAdventure,
                backToShell: () => goHomeFromLegacy(),
                getSnapshot: () => typeof structuredClone === "function" ? structuredClone(app.snapshot) : JSON.parse(JSON.stringify(app.snapshot))
          '''
          if old_api not in text:
              raise SystemExit('global API anchor not found')
          text = text.replace(old_api, new_api, 1)
          ui.write_text(text, encoding='utf-8')

          app = Path('app.js')
          app_text = app.read_text(encoding='utf-8')
          old_admin = '''  if (screen === "rank") loadRanking();
            if (screen === "manage") loadRewardAdminClaims();
            if (screen === "game") startRound("choice");
          '''
          new_admin = '''  if (screen === "rank") loadRanking();
            if (screen === "manage" && window.HEATHER_FIREBASE_ADMIN === true) {
              loadRewardAdminClaims();
            } else if (screen === "manage") {
              state.rewardAdminClaims = [];
              state.rewardAdminPlayers = [];
              state.rewardAdminLoaded = true;
            }
            if (screen === "game") startRound("choice");
          '''
          if old_admin not in app_text:
              raise SystemExit('admin load anchor not found')
          app.write_text(app_text.replace(old_admin, new_admin, 1), encoding='utf-8')
          PY
          node --check ui-v9.js
          node --check app.js
          grep -q 'interceptLegacyBack' ui-v9.js
          grep -q 'HEATHER_FIREBASE_ADMIN' app.js
      - name: Commit navigation and role behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v9.js app.js
          git commit -m "fix: make focused screens navigate back and require admin claims"
          git push origin HEAD:codex/commercial-ui-v9
