name: Harden commercial security rules

on:
  push:
    branches: ["codex/commercial-ui-v9"]
    paths:
      - ".github/workflows/ui-v9-security-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-ui-v9
          fetch-depth: 0
      - name: Require custom claims for cross-user reward administration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          text = path.read_text(encoding='utf-8')
          signed = '''    function signedIn() {
                return request.auth != null;
              }
          '''
          roles = '''    function signedIn() {
                return request.auth != null;
              }

              function isAdmin() {
                return signedIn() && request.auth.token.admin == true;
              }

              function isGuardian() {
                return signedIn()
                  && (request.auth.token.guardian == true || request.auth.token.admin == true);
              }
          '''
          if signed not in text:
              raise SystemExit('signedIn anchor not found')
          text = text.replace(signed, roles, 1)

          old = '''        allow update: if signedIn()
                  && validPlayer()
                  && (request.auth.uid == uid || rewardClaimAdminUpdate());
          '''
          new = '''        allow update: if signedIn()
                  && validPlayer()
                  && (request.auth.uid == uid || (isAdmin() && rewardClaimAdminUpdate()));
          '''
          if old not in text:
              raise SystemExit('player update rule not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'function isAdmin' firestore.rules
          grep -q 'isAdmin() && rewardClaimAdminUpdate()' firestore.rules
      - name: Commit hardened rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "security: require an admin claim for cross-user reward updates"
          git push origin HEAD:codex/commercial-ui-v9
