<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heather Word 스펠링몬</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(140deg,#fff7ed,#f5f3ff,#e0f2fe);color:#1f2937}.wrap{max-width:880px;margin:auto;padding:14px 14px 90px}.top{position:sticky;top:8px;z-index:3;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#ffffffdd;backdrop-filter:blur(10px);border-radius:26px;padding:14px;box-shadow:0 14px 32px #0002}.logo{font-size:32px;background:linear-gradient(135deg,#8b5cf6,#f97316);width:54px;height:54px;border-radius:18px;display:grid;place-items:center}.brand{display:flex;gap:10px;align-items:center}h1{font-size:20px;margin:0}.sub,.mini{font-size:12px;color:#6b7280}.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{font-weight:900;border-radius:999px;background:#ede9fe;color:#5b21b6;padding:8px 10px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:13px 0}.tab,button{border:0;cursor:pointer;font-weight:900}.tab{border-radius:17px;padding:12px 6px;background:#fff;color:#374151;box-shadow:0 8px 18px #0001}.tab.on{background:#7c3aed;color:white}.panel{display:none}.panel.on{display:block}.card{background:#ffffffe8;border-radius:26px;padding:18px;margin:12px 0;box-shadow:0 16px 35px #0002}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.big{min-height:92px;text-align:left;border-radius:22px;padding:16px;background:linear-gradient(135deg,#fff,#f3e8ff);box-shadow:0 10px 22px #0001}.e{font-size:34px;display:block}.btn{border-radius:18px;padding:13px 15px;background:#ede9fe;color:#5b21b6}.pri{background:#7c3aed;color:white}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pet{text-align:center}.petEmoji{font-size:92px;filter:drop-shadow(0 12px 15px #7c3aed33);animation:bob 2s infinite}.bar{height:16px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#22c55e,#bef264)}.mission{display:grid;gap:8px}.mi{display:flex;gap:10px;align-items:center;background:#f9fafb;border-radius:16px;padding:10px}.ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb}.done .ck{background:#bbf7d0;color:#15803d}.center{text-align:center}.emo{font-size:90px}.word{font-size:46px;font-weight:1000}.mean{font-size:24px;color:#4b5563}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{border-radius:20px;padding:18px;font-size:20px;background:#f3f4f6}.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:58px;background:#f9fafb;border-radius:20px;padding:10px;margin:10px 0}.tile{min-width:46px;height:48px;border-radius:15px;background:#fde68a;color:#78350f;font-size:24px;box-shadow:0 5px 0 #f59e0b}.ans .tile{background:#bfdbfe;color:#1e3a8a;box-shadow:0 5px 0 #60a5fa}.type{width:100%;border:3px solid #ddd6fe;border-radius:20px;padding:16px;font-size:24px;text-align:center;font-weight:900}.fb{text-align:center;font-size:18px;font-weight:1000;min-height:32px}.good{color:#16a34a}.wrong{color:#ef4444}.scan{border:3px dashed #c4b5fd;border-radius:24px;padding:18px;text-align:center;background:#faf5ff}.file{display:none}.preview{max-width:100%;border-radius:18px;margin-top:12px}.ocr{display:grid;gap:8px}.ocrrow{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;background:#f9fafb;border-radius:15px;padding:10px}.ocrrow input[type=text],.input{width:100%;border:1px solid #ddd;border-radius:12px;padding:10px}.list{display:grid;gap:8px}.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:#f9fafb;border-radius:15px;padding:10px}dialog{border:0;border-radius:24px;padding:18px;width:min(460px,92vw)}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:620px){.grid,.choices{grid-template-columns:1fr}.tab{font-size:12px}.ocrrow{grid-template-columns:auto 1fr}.ocrrow .btn{grid-column:1/-1}.word{font-size:40px}.pills{max-width:140px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><div class="logo">🦄</div><div><h1>Heather Word</h1><div class="sub">찍고 · 듣고 · 맞히고 · 키우는 스펠링몬</div></div></div><div class="pills"><span class="pill" id="score">⭐0</span><span class="pill" id="cookie">🍪0</span><span class="pill" id="count">📚0</span></div></header><nav class="tabs"><button class="tab on" data-p="home">🏠홈</button><button class="tab" data-p="cards">🃏카드</button><button class="tab" data-p="game">✍️게임</button><button class="tab" data-p="scan">📷스캔</button><button class="tab" data-p="admin">⚙️관리</button></nav>
<section id="home" class="panel on"><div class="card pet"><div class="petEmoji" id="pet">🥚</div><h2 id="petName">알 스펠링몬</h2><p class="sub" id="petMsg">단어를 맞히면 알이 깨어나요.</p><div class="bar"><i id="xp"></i></div><div class="row between"><b id="lv">Lv.1</b><span class="mini" id="next">100XP 남음</span></div></div><div class="card"><h2>오늘의 미션 🌱</h2><div class="mission" id="missions"></div></div><div class="grid"><button class="big" onclick="go('cards')"><span class="e">🔊</span><b>듣고 카드 보기</b><br><span class="mini">소리와 뜻 익히기</span></button><button class="big" onclick="goGame('block')"><span class="e">🧩</span><b>글자 블록</b><br><span class="mini">순서 맞히기</span></button><button class="big" onclick="goGame('type')"><span class="e">✍️</span><b>직접 쓰기</b><br><span class="mini">진짜 스펠링 도전</span></button><button class="big" onclick="go('scan')"><span class="e">📷</span><b>책 단어 스캔</b><br><span class="mini">사진에서 단어 찾기</span></button></div></section>
<section id="cards" class="panel"><div class="card center"><div class="row between"><button class="btn" id="prev">←</button><button class="btn pri" id="say">🔊 발음</button><button class="btn" id="nextc">→</button></div><div class="emo" id="cemo">🍎</div><div class="word" id="cword">apple</div><div class="mean" id="cmean">사과</div><button class="btn ok" id="know">알아요 +5</button> <button class="btn" id="hard">어려워요</button></div></section>
<section id="game" class="panel"><div class="card"><div class="row between"><h2 id="gt">게임</h2><button class="btn" onclick="newGame()">새 문제</button></div><div class="row"><button class="btn pri" onclick="goGame('choice')">뜻맞히기</button><button class="btn pri" onclick="goGame('block')">글자블록</button><button class="btn pri" onclick="goGame('blank')">빈칸</button><button class="btn pri" onclick="goGame('type')">직접쓰기</button></div><div id="gbox"></div><div class="fb" id="fb"></div></div></section>
<section id="scan" class="panel"><div class="card"><h2>책/프린트 단어 스캔 📷</h2><p class="sub">AI/API 없이 휴대폰 브라우저에서 OCR을 돌립니다. 밝고 반듯하게 찍을수록 잘 읽어요.</p><div class="scan"><label class="btn pri" for="photo">📸 사진 찍기 / 이미지 올리기</label><input id="photo" class="file" type="file" accept="image/*" capture="environment"><img id="preview" class="preview" hidden><div id="prog" class="mini"></div></div></div><div class="card" id="ocrcard" hidden><div class="row between"><h2>찾은 단어 후보</h2><button class="btn pri" id="addsel">선택 추가</button></div><p class="sub">이상한 단어는 체크 해제, 뜻은 부모님이 고쳐 주세요.</p><div class="ocr" id="ocrlist"></div></div></section>
<section id="admin" class="panel"><div class="card"><h2>부모 관리</h2><div class="grid"><button class="big" id="openAdd"><span class="e">➕</span><b>단어 직접 추가</b></button><button class="big" id="backup"><span class="e">📤</span><b>백업 내보내기</b></button><button class="big" id="restore"><span class="e">📥</span><b>백업 가져오기</b></button><button class="big" id="reset"><span class="e">🧹</span><b>점수만 초기화</b></button></div></div><div class="card"><h2>내 단어장</h2><div class="list" id="wlist"></div></div></section></div>
<dialog id="dlg"><h2>단어 추가</h2><input class="input" id="aw" placeholder="영어 단어"><input class="input" id="am" placeholder="한글 뜻"><input class="input" id="ae" placeholder="아이콘 예: 🍎"><div class="row between"><button class="btn" onclick="dlg.close()">닫기</button><button class="btn pri" id="savew">추가</button></div></dialog><input type="file" id="bin" accept="application/json" hidden>
<script>
const starter='apple 사과 🍎|banana 바나나 🍌|orange 오렌지 🍊|grape 포도 🍇|milk 우유 🥛|cookie 쿠키 🍪|bread 빵 🍞|water 물 💧|cat 고양이 🐱|dog 강아지 🐶|fish 물고기 🐟|bird 새 🐦|book 책 📘|pencil 연필 ✏️|bag 가방 🎒|school 학교 🏫|teacher 선생님 👩‍🏫|friend 친구 🧑‍🤝‍🧑|ball 공 ⚽|star 별 ⭐'.split('|').map((x,i)=>{let a=x.split(' ');return{id:'b'+i,word:a[0],mean:a[1],emo:a.slice(2).join(' '),basic:1}});
const dict={hello:['안녕','👋'],red:['빨간색','🔴'],blue:['파란색','🔵'],yellow:['노란색','🟡'],green:['초록색','🟢'],one:['하나','1️⃣'],two:['둘','2️⃣'],three:['셋','3️⃣'],mom:['엄마','👩'],dad:['아빠','👨'],home:['집','🏠'],house:['집','🏠'],car:['자동차','🚗'],bus:['버스','🚌'],sun:['해','☀️'],moon:['달','🌙'],rain:['비','🌧️'],snow:['눈','❄️'],flower:['꽃','🌼'],tree:['나무','🌳'],run:['달리다','🏃'],jump:['점프하다','🦘'],eat:['먹다','🍽️'],drink:['마시다','🥤'],like:['좋아하다','💜'],play:['놀다','🎮'],read:['읽다','📖'],write:['쓰다','✍️'],big:['큰','🐘'],small:['작은','🐜'],happy:['행복한','😊'],sad:['슬픈','😢']};
const stop=new Set('unit lesson page name date class english word words vocabulary phonics sentence sentences chapter review test quiz homework worksheet write trace circle match look listen repeat ask answer question story activity number color draw line'.split(' '));
let S=JSON.parse(localStorage.hw||'{}');S=Object.assign({custom:[],score:0,cookie:0,xp:0,streak:0,last:'',daily:{date:day(),card:0,game:0,spell:0,scan:0},prog:{}},S);let card=0,mode='block',gw,ans=[],bank=[];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],words=()=>{let m=new Set,r=[];[...starter,...S.custom].forEach(w=>{if(!m.has(w.word)){m.add(w.word);r.push(w)}});return r};function day(){return new Date().toISOString().slice(0,10)}function save(){localStorage.hw=JSON.stringify(S);render()}function daily(){if(S.daily.date!==day())S.daily={date:day(),card:0,game:0,spell:0,scan:0}}function addpt(p,k,w){daily();S.score+=p;S.cookie+=Math.ceil(p/5);S.xp+=p;S.daily[k]++;if(S.last!==day()){S.streak=S.last&&((new Date(day())-new Date(S.last))/864e5===1)?S.streak+1:1;S.last=day()}if(w){let q=S.prog[w.id]||{c:0,w:0,s:0};q.c++;if(k==='spell')q.s++;S.prog[w.id]=q}save();party()}function wrong(w){let q=S.prog[w.id]||{c:0,w:0,s:0};q.w++;q.review=1;S.prog[w.id]=q;save()}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function render(){daily();$('#score').textContent='⭐'+S.score;$('#cookie').textContent='🍪'+S.cookie;$('#count').textContent='📚'+words().length;let st=stage();$('#pet').textContent=st[0];$('#petName').textContent=st[1];$('#petMsg').textContent=st[3];let prev=st[2]-100,p=Math.max(5,Math.min(100,(S.xp-prev)/100*100));$('#xp').style.width=p+'%';$('#lv').textContent='Lv.'+(Math.floor(S.xp/100)+1)+' · '+S.streak+'일 연속';$('#next').textContent=Math.max(0,st[2]-S.xp)+'XP 남음';$('#missions').innerHTML=[['카드 5장','card',5],['게임 5문제','game',5],['스펠링 3개','spell',3],['스캔/추가 1번','scan',1]].map(x=>`<div class="mi ${S.daily[x[1]]>=x[2]?'done':''}"><div class="ck">${S.daily[x[1]]>=x[2]?'✓':''}</div><b>${x[0]}</b><span class="mini">${Math.min(S.daily[x[1]],x[2])}/${x[2]}</span></div>`).join('');showCard();list()}function stage(){let x=S.xp;if(x<100)return['🥚','알 스펠링몬',100,'단어를 맞히면 알이 깨어나요'];if(x<300)return['🐣','아기 스펠링몬',300,'쿠키 먹고 자라는 중!'];if(x<700)return['🐰','토끼 스펠링몬',700,'스펠링을 좋아해요'];if(x<1200)return['🦊','여우 스펠링몬',1200,'어려운 단어도 척척'];return['🦄','전설의 스펠링몬',Math.ceil((S.xp+1)/100)*100,'새 단어를 더 먹여주세요']}
function go(id){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===id));$$('.panel').forEach(p=>p.classList.toggle('on',p.id===id))}$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.p));function showCard(){let w=words()[card%words().length];$('#cemo').textContent=w.emo||'📘';$('#cword').textContent=w.word;$('#cmean').textContent=w.mean||'뜻 입력'}$('#nextc').onclick=()=>{card++;S.daily.card++;save()};$('#prev').onclick=()=>{card=Math.max(0,card-1);S.daily.card++;save()};$('#say').onclick=()=>speak(words()[card%words().length].word);$('#know').onclick=()=>addpt(5,'card',words()[card%words().length]);$('#hard').onclick=()=>{wrong(words()[card%words().length]);card++;save()};
function pick(){let a=words(),r=a.filter(w=>S.prog[w.id]?.review);return (r.length&&Math.random()<.5?r:a)[Math.floor(Math.random()*(r.length&&Math.random()<.5?r:a).length)]}function sh(a){return [...a].sort(()=>Math.random()-.5)}function goGame(m){mode=m;go('game');newGame()}function head(){return`<div class=center><div class=emo>${gw.emo||'📘'}</div><div class=mean>${gw.mean||'뜻 입력'}</div><button class="btn" onclick="speak('${gw.word}')">🔊 발음</button></div>`}function newGame(){gw=pick();ans=[];bank=sh(gw.word.split('').map((c,i)=>({c,i})));$('#fb').textContent='';$('#gt').textContent={choice:'뜻 맞히기',block:'글자 블록',blank:'빈칸 채우기',type:'직접 쓰기'}[mode];if(mode==='choice')choice();if(mode==='block')block();if(mode==='blank')blank();if(mode==='type')type()}function choice(){let cs=sh([gw,...sh(words().filter(w=>w.id!==gw.id)).slice(0,3)]);$('#gbox').innerHTML=head()+`<div class=choices>${cs.map(w=>`<button class=choice data-id=${w.id}>${w.word}</button>`).join('')}</div>`;$$('.choice').forEach(b=>b.onclick=()=>check(b.dataset.id===gw.id,5,'game'))}function block(){$('#gbox').innerHTML=head()+`<div class="bank ans" id=a></div><div class=bank id=b></div><button class="btn" id=clear>지우기</button> <button class="btn pri" id=ok>확인 +10</button>`;draw();$('#clear').onclick=()=>{ans=[];bank=sh(gw.word.split('').map((c,i)=>({c,i})));draw()};$('#ok').onclick=()=>check(ans.map(x=>x.c).join('')===gw.word,10,'game')}function draw(){$('#a').innerHTML=ans.map((x,i)=>`<button class=tile data-a=${i}>${x.c}</button>`).join('');$('#b').innerHTML=bank.map((x,i)=>`<button class=tile data-b=${i}>${x.c}</button>`).join('');$$('[data-b]').forEach(t=>t.onclick=()=>{ans.push(bank.splice(t.dataset.b,1)[0]);draw()});$$('[data-a]').forEach(t=>t.onclick=()=>{bank.push(ans.splice(t.dataset.a,1)[0]);draw()})}function blank(){$('#gbox').innerHTML=head()+`<div class=word>${gw.word.split('').map((c,i)=>i%2?'_':c).join(' ')}</div><input class=type id=inp placeholder="전체 단어 쓰기"><button class="btn pri" id=ok2>확인 +15</button>`;$('#ok2').onclick=()=>check(norm($('#inp').value)===gw.word,15,'spell')}function type(){setTimeout(()=>speak(gw.word),200);$('#gbox').innerHTML=`<div class=center><div class=emo>🎧</div><button class=btn onclick="speak('${gw.word}')">🔊 다시 듣기</button><p>${gw.mean||''} ${gw.emo||''}</p></div><input class=type id=inp placeholder="영어 단어"><button class="btn pri" id=ok2>확인 +20</button>`;$('#ok2').onclick=()=>check(norm($('#inp').value)===gw.word,20,'spell')}function check(ok,p,k){if(ok){$('#fb').className='fb good';$('#fb').textContent='정답! '+gw.word+' 🎉';addpt(p,k,gw);setTimeout(newGame,800)}else{$('#fb').className='fb wrong';$('#fb').textContent='아깝다! 정답은 '+gw.word;wrong(gw);speak(gw.word)}}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'')}function clean(w){w=norm(w);if(w.endsWith('ies'))w=w.slice(0,-3)+'y';else if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss'))w=w.slice(0,-1);return w}
$('#photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.hidden=false;prog.textContent='읽는 중...';ocrcard.hidden=true;try{let r=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.progress)prog.textContent='읽는 중 '+Math.round(m.progress*100)+'%'}});let arr=[...new Set((r.data.text.match(/[A-Za-z]{2,}/g)||[]).map(clean).filter(w=>w.length>2&&!stop.has(w)))].slice(0,60);ocrlist.innerHTML=arr.map(w=>`<div class=ocrrow><input type=checkbox checked data-w=${w}><b>${w}</b><input type=text value="${dict[w]?.[0]||''}" placeholder="한글 뜻"><button class=btn onclick="speak('${w}')">🔊</button></div>`).join('');ocrcard.hidden=false;prog.textContent=arr.length+'개 후보 발견'}catch(e){prog.textContent='OCR 실패. 인터넷 연결 후 다시 시도해 주세요.'}};$('#addsel').onclick=()=>{let n=0;$$('.ocrrow').forEach(r=>{let cb=r.querySelector('[type=checkbox]');if(cb.checked&&addword(cb.dataset.w,r.querySelector('[type=text]').value,dict[cb.dataset.w]?.[1]||'📘'))n++});S.daily.scan++;save();alert(n+'개 추가했어요')};function addword(w,m,e){w=clean(w);if(!w||words().some(x=>x.word===w))return 0;S.custom.push({id:'c'+Date.now()+Math.random(),word:w,mean:m,emo:e});return 1}openAdd.onclick=()=>dlg.showModal();savew.onclick=()=>{if(addword(aw.value,am.value,ae.value||'📘')){S.daily.scan++;save();dlg.close();aw.value=am.value=ae.value=''}else alert('이미 있거나 짧아요')};function list(){wlist.innerHTML=words().map(w=>{let p=S.prog[w.id]||{};return`<div class=wrow><div style="font-size:30px">${w.emo||'📘'}</div><div><b>${w.word}</b> <span class=mini>${w.mean||'뜻 입력'}</span><div class=mini>정답 ${p.c||0} · 오답 ${p.w||0} · 스펠 ${p.s||0}</div></div><div><button class=btn onclick="speak('${w.word}')">🔊</button>${w.basic?'':`<button class="btn bad" onclick="S.custom=S.custom.filter(x=>x.id!=='${w.id}');save()">삭제</button>`}</div></div>`}).join('')}backup.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)]));a.download='heather-word-backup.
